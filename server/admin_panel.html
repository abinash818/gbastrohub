<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GB Astro - Premium Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #f57c00;
            --primary-dark: #e65100;
            --secondary: #475569;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --text-dim: #64748b;
            --border: #e2e8f0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Outfit', sans-serif; }
        body { background-color: var(--bg); color: var(--text); min-height: 100vh; padding: 30px 20px; }
        .container { max-width: 1200px; margin: auto; }
        
        header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 30px; 
            padding: 20px 30px; 
            background: var(--card-bg); 
            border-radius: 16px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.05); 
        }
        h1 { font-size: 22px; color: var(--text); display: flex; align-items: center; gap: 10px; font-weight: 700; }
        .refresh-btn { 
            background: var(--primary); 
            color: white; 
            border: none; 
            padding: 10px 20px; 
            border-radius: 10px; 
            font-weight: 600; 
            cursor: pointer; 
            transition: 0.2s; 
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .refresh-btn:hover { background: var(--primary-dark); transform: translateY(-1px); }
        
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: var(--card-bg); padding: 25px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); text-align: center; border: 1px solid var(--border); }
        .stat-value { font-size: 36px; font-weight: 700; color: var(--text); margin-bottom: 4px; }
        .stat-label { color: var(--text-dim); font-size: 13px; text-transform: uppercase; letter-spacing: 1px; font-weight: 600; }

        .table-container { 
            background: var(--card-bg); 
            border-radius: 20px; 
            overflow: hidden; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.05); 
            border: 1px solid var(--border);
        }
        table { width: 100%; border-collapse: collapse; }
        th { background: #f1f5f9; text-align: left; padding: 16px 20px; color: var(--text-dim); font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid var(--border); }
        td { padding: 16px 20px; border-bottom: 1px solid var(--border); vertical-align: middle; }
        tr:last-child td { border-bottom: none; }

        .badge { padding: 6px 12px; border-radius: 6px; font-size: 11px; font-weight: 700; text-transform: uppercase; }
        .badge-PENDING { background: #fef3c7; color: #92400e; }
        .badge-APPROVED { background: #dcfce7; color: #166534; }
        .badge-BLOCKED { background: #fee2e2; color: #991b1b; }

        .input-field { 
            background: #f8fafc; 
            border: 1.5px solid var(--border); 
            color: var(--text); 
            padding: 8px 12px; 
            border-radius: 8px; 
            font-size: 13px; 
            width: 100%;
            transition: 0.2s;
        }
        .input-field:focus { border-color: var(--primary); outline: none; background: white; }

        .btn-sm { padding: 8px 16px; border-radius: 8px; border: none; cursor: pointer; font-size: 12px; font-weight: 600; transition: 0.2s; display: inline-flex; align-items: center; justify-content: center; }
        .btn-save { background: var(--primary); color: white; margin-top: 5px; width: 100%; }
        .btn-save:hover { background: var(--primary-dark); }
        .btn-approve { background: var(--success); color: white; }
        .btn-approve:hover { opacity: 0.9; }
        .btn-block { background: var(--danger); color: white; }
        .btn-block:hover { opacity: 0.9; }
        .btn-clear { background: #94a3b8; color: white; font-size: 10px; padding: 4px 8px; }
        .btn-delete { background: #475569; color: white; width: 100%; }

        .loading { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(255, 255, 255, 0.7); display: none; justify-content: center; align-items: center; z-index: 1000; backdrop-filter: blur(4px); }
        .spinner { width: 40px; height: 40px; border: 4px solid #f1f5f9; border-top: 4px solid var(--primary); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .device-info { font-size: 11px; color: var(--text-dim); margin-top: 4px; display: block; max-width: 180px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .user-email { font-weight: 700; color: var(--text); font-size: 14px; }
        .user-phone { color: var(--text-dim); font-size: 12px; }

        /* Modal Styles */
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; z-index: 100; backdrop-filter: blur(2px); }
        .modal-content { background: var(--card-bg); padding: 25px; border-radius: 16px; width: 90%; max-width: 500px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .modal-title { font-size: 18px; font-weight: 700; color: var(--text); }
        .close-btn { background: none; border: none; font-size: 24px; cursor: pointer; color: var(--text-dim); }
        .feature-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .feature-item { display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 600; color: var(--text); }
        .feature-item input { width: 18px; height: 18px; cursor: pointer; accent-color: var(--primary); }


        @media (max-width: 768px) {
            body { padding: 15px 10px; }
            header {
                flex-direction: column;
                gap: 15px;
                padding: 15px;
                text-align: center;
            }
            header div {
                flex-direction: column;
                width: 100% !important;
                gap: 10px !important;
            }
            #search-input {
                max-width: none !important;
                width: 100%;
            }
            .refresh-btn {
                width: 100%;
                justify-content: center;
            }
            .stats {
                grid-template-columns: 1fr;
                gap: 10px;
            }
            .stat-card {
                padding: 15px;
            }
            .stat-value {
                font-size: 28px;
            }
            .table-container {
                border: none;
                box-shadow: none;
                background: transparent;
            }
            table, thead, tbody, th, td, tr { 
                display: block; 
            }
            thead tr { 
                position: absolute;
                top: -9999px;
                left: -9999px;
            }
            tr {
                background: var(--card-bg);
                border-radius: 16px;
                margin-bottom: 20px;
                padding: 18px;
                border: 1px solid var(--border);
                box-shadow: 0 4px 15px rgba(0,0,0,0.02);
            }
            td { 
                border: none;
                padding: 10px 0;
                position: relative;
                padding-left: 45%; 
                text-align: left;
                border-bottom: 1px dashed #f1f5f9;
            }
            td:last-child {
                border-bottom: none;
                padding-bottom: 0;
            }
            td:before { 
                position: absolute;
                top: 50%;
                left: 6px;
                transform: translateY(-50%);
                width: 40%; 
                padding-right: 10px; 
                white-space: nowrap;
                font-weight: 600;
                color: var(--text-dim);
                font-size: 11px;
                text-transform: uppercase;
                letter-spacing: 0.5px;
            }
            td:nth-of-type(1) { 
                padding-left: 0; 
                border-bottom: 1.5px solid var(--border); 
                padding-bottom: 12px; 
                margin-bottom: 8px; 
            }
            td:nth-of-type(1):before { content: ""; }
            
            td:nth-of-type(2):before { content: "Status"; }
            td:nth-of-type(3):before { content: "Expiry Date"; }
            td:nth-of-type(4):before { content: "Device Limit"; }
            td:nth-of-type(5):before { content: "Devices"; }
            td:nth-of-type(6):before { content: "Actions"; }
            
            td:nth-of-type(6) {
                padding-left: 0;
                margin-top: 12px;
            }
            td:nth-of-type(6):before { content: ""; }
            
            .input-field {
                display: inline-block;
            }
            .device-info {
                max-width: none;
                white-space: normal;
                overflow: visible;
                text-overflow: clip;
            }
        }
    </style>
</head>
<body>

<div class="loading" id="loader"><div class="spinner"></div></div>

<div class="container">
    <header>
        <h1>🛡️ GB Astro Admin Panel</h1>
        <div style="display:flex; gap:10px; flex: 1; justify-content: flex-end; align-items: center;">
            <a href="admin_plans.html" class="refresh-btn" style="background:var(--success); text-decoration:none;">💎 Manage Plans</a>
            <input type="text" id="search-input" class="input-field" placeholder="Search by Email or Phone..." style="max-width: 300px; margin-bottom: 0;" onkeyup="filterTable()">
            <button class="refresh-btn" onclick="fetchUsers()">🔄 Refresh</button>
        </div>
    </header>

    <div class="stats">
        <div class="stat-card"><div class="stat-value" id="total-users">0</div><div class="stat-label">Total Users</div></div>
        <div class="stat-card"><div class="stat-value" id="pending-users" style="color: var(--warning)">0</div><div class="stat-label">Pending</div></div>
        <div class="stat-card"><div class="stat-value" id="approved-users" style="color: var(--success)">0</div><div class="stat-label">Active</div></div>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>User Details</th>
                    <th>Status</th>
                    <th>Plan & Expiry</th>
                    <th>Device Limit</th>
                    <th>Devices</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="user-table-body"></tbody>
        </table>
    </div>
</div>

<!-- Features Modal -->
<div class="modal-overlay" id="features-modal">
    <div class="modal-content">
        <div class="modal-header">
            <div class="modal-title">Manage User Features</div>
            <button class="close-btn" onclick="closeFeaturesModal()">&times;</button>
        </div>
        <input type="hidden" id="modal-user-id">
        <div class="feature-grid">
            <label class="feature-item"><input type="checkbox" class="feature-cb" value="jathagam"> Jathagam</label>
            <label class="feature-item"><input type="checkbox" class="feature-cb" value="porutham"> Porutham</label>
            <label class="feature-item"><input type="checkbox" class="feature-cb" value="jamakkol"> Jamakkol</label>
            <label class="feature-item"><input type="checkbox" class="feature-cb" value="nadi"> Nadi Astrology</label>
            <label class="feature-item"><input type="checkbox" class="feature-cb" value="numerology"> Numerology</label>
            <label class="feature-item"><input type="checkbox" class="feature-cb" value="muhurtham"> Muhurtham</label>
            <label class="feature-item"><input type="checkbox" class="feature-cb" value="kp_astrology"> KP Astrology</label>
            <label class="feature-item"><input type="checkbox" class="feature-cb" value="panchangam"> Panchangam</label>
        </div>
        <div style="display: flex; gap: 10px; margin-top: 10px;">
            <button class="btn-sm btn-save" style="font-size:14px; padding: 12px; flex: 1; margin-top: 0;" onclick="saveFeatures()">Save Features</button>
            <button class="btn-sm btn-approve" id="btn-save-approve" style="font-size:14px; padding: 12px; flex: 1;" onclick="saveFeaturesAndApprove()">Save & Approve</button>
        </div>
    </div>
</div>

<script>
    const API_URL = 'admin_api.php'; 
    const loader = document.getElementById('loader');
    let allPlans = [];
    let globalUsers = [];

    async function fetchPlansForDropdown() {
        try {
            const res = await fetch('subscription_api.php', {
                method: 'POST',
                headers: {'Content-Type':'application/json'},
                body: JSON.stringify({ action: 'get_all_plans' })
            });
            const data = await res.json();
            if (data.success) {
                allPlans = data.plans.filter(p => p.is_active == 1);
            }
        } catch(e) { console.error(e); }
    }

    async function fetchUsers() {
        showLoader(true);
        try {
            const res = await fetch(API_URL);
            const data = await res.json();
            if (data.success) {
                globalUsers = data.users;
                renderTable(data.users);
                updateStats(data.users);
            }
        } catch (e) { console.error(e); }
        showLoader(false);
    }

    function renderTable(users) {
        const tbody = document.getElementById('user-table-body');
        tbody.innerHTML = '';
        users.forEach(user => {
            let planOptions = `<option value="">-- No Plan (Free) --</option>`;
            allPlans.forEach(p => {
                planOptions += `<option value="${p.id}" ${user.plan_id == p.id ? 'selected' : ''}>${p.name}</option>`;
            });

            const purchasedDate = (user.purchased_date === '0000-00-00') ? '' : (user.purchased_date || '');
            const expiryDate = (user.expiry_date === '0000-00-00') ? '' : (user.expiry_date || '');

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>
                    <div class="user-email">${user.email}</div>
                    <div class="user-phone">${user.phone_number || 'No Phone'}</div>
                </td>
                <td><span class="badge badge-${user.status}">${user.status}</span></td>
                <td>
                    <div style="font-size:11px; margin-bottom:4px; font-weight:600; color:var(--text-dim)">Assigned Plan:</div>
                    <select class="input-field" id="plan-${user.id}" onchange="onPlanChange(${user.id})" style="margin-bottom:8px">
                        ${planOptions}
                    </select>
                    <div style="font-size:11px; margin-bottom:4px; font-weight:600; color:var(--text-dim)">Purchased Date:</div>
                    <input type="date" class="input-field" id="purchased-${user.id}" value="${purchasedDate}" style="margin-bottom:8px">
                    <div style="font-size:11px; margin-bottom:4px; font-weight:600; color:var(--text-dim)">Expiry Date:</div>
                    <input type="date" class="input-field" id="expiry-${user.id}" value="${expiryDate}">
                </td>
                <td>
                    <input type="number" class="input-field" id="limit-${user.id}" value="${user.device_limit || 1}" min="1" style="width:70px">
                </td>
                <td>
                    <div style="font-size:13px; font-weight:600">${user.current_devices} / ${user.device_limit}</div>
                    <span class="device-info" title="${user.device_list || ''}">${user.device_list || 'None'}</span>
                    <button class="btn-sm btn-clear" onclick="clearDevices(${user.id})" style="margin-top:5px">Clear</button>
                </td>
                <td>
                    <div style="display:flex; flex-direction:column; gap:6px; min-width: 140px">
                        <div style="display:flex; gap:6px">
                            <button class="btn-sm btn-save" onclick="saveSettings(${user.id})" style="flex:1">Save</button>
                            <button class="btn-sm" style="background:#6366f1; color:white; flex:1" onclick="resetPassword(${user.id})" title="Reset to password@123">Reset Pwd</button>
                        </div>
                        <div style="display:flex; gap:6px">
                            <button class="btn-sm btn-approve" onclick="updateStatus(${user.id}, 'approve')" ${user.status==='APPROVED'?'disabled':''}>Approve</button>
                            <button class="btn-sm btn-block" onclick="updateStatus(${user.id}, 'block')" ${user.status==='BLOCKED'?'disabled':''}>Block</button>
                        </div>
                        <button class="btn-sm" style="background:#0284c7; color:white; width: 100%" onclick="openFeaturesModal(${user.id})">✨ Features</button>
                        <button class="btn-sm btn-delete" onclick="updateStatus(${user.id}, 'delete')">Delete</button>
                    </div>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    function onPlanChange(userId) {
        const planId = document.getElementById(`plan-${userId}`).value;
        const plan = allPlans.find(p => p.id == planId);
        if (plan && plan.duration_days) {
            const date = new Date();
            document.getElementById(`purchased-${userId}`).value = date.toISOString().split('T')[0];
            
            date.setDate(date.getDate() + parseInt(plan.duration_days));
            document.getElementById(`expiry-${userId}`).value = date.toISOString().split('T')[0];
        }
    }

    async function saveSettings(id) {
        const expiry = document.getElementById(`expiry-${id}`).value;
        const purchased = document.getElementById(`purchased-${id}`).value;
        const limit = document.getElementById(`limit-${id}`).value;
        const planId = document.getElementById(`plan-${id}`).value;
        await postAction({ id, action: 'update_settings', expiry_date: expiry, purchased_date: purchased, device_limit: limit, plan_id: planId });
    }

    async function clearDevices(id) {
        if(confirm('Clear all registered devices?')) {
            await postAction({ id, action: 'clear_devices' });
        }
    }

    async function resetPassword(id) {
        if(confirm('Reset password to default (password@123)?')) {
            await postAction({ id, action: 'reset_password' });
        }
    }

    async function updateStatus(id, action) {
        if(action === 'delete' && !confirm('Are you sure you want to delete this user?')) return;
        
        let body = { id, action };
        if (action === 'approve') {
            body.expiry_date = document.getElementById(`expiry-${id}`).value;
            body.purchased_date = document.getElementById(`purchased-${id}`).value;
            body.device_limit = document.getElementById(`limit-${id}`).value;
            body.plan_id = document.getElementById(`plan-${id}`).value;
            body.action = 'approve_with_settings';
        }
        await postAction(body);
    }

    async function postAction(body) {
        showLoader(true);
        try {
            const res = await fetch(API_URL, {
                method: 'POST',
                headers: {'Content-Type':'application/json'},
                body: JSON.stringify(body)
            });
            const data = await res.json();
            if(data.success) fetchUsers();
            else alert(data.message);
        } catch(e) { alert('Error: ' + e); }
        showLoader(false);
    }

    function updateStats(users) {
        document.getElementById('total-users').innerText = users.length;
        document.getElementById('pending-users').innerText = users.filter(u => u.status === 'PENDING').length;
        document.getElementById('approved-users').innerText = users.filter(u => u.status === 'APPROVED').length;
    }

    // Modal Logic
    function openFeaturesModal(userId) {
        document.getElementById('modal-user-id').value = userId;
        const user = globalUsers.find(u => u.id == userId);
        
        let userFeatures = [];
        try {
            if (user && user.custom_features) {
                userFeatures = JSON.parse(user.custom_features) || [];
            }
        } catch(e) {}

        const checkboxes = document.querySelectorAll('.feature-cb');
        checkboxes.forEach(cb => {
            cb.checked = userFeatures.includes(cb.value);
        });

        // Disable Save & Approve if already APPROVED
        const btnSaveApprove = document.getElementById('btn-save-approve');
        if (btnSaveApprove) {
            if (user && user.status === 'APPROVED') {
                btnSaveApprove.disabled = true;
                btnSaveApprove.style.opacity = '0.5';
                btnSaveApprove.style.cursor = 'not-allowed';
            } else {
                btnSaveApprove.disabled = false;
                btnSaveApprove.style.opacity = '1';
                btnSaveApprove.style.cursor = 'pointer';
            }
        }

        document.getElementById('features-modal').style.display = 'flex';
    }

    function closeFeaturesModal() {
        document.getElementById('features-modal').style.display = 'none';
    }

    async function saveFeatures() {
        const userId = document.getElementById('modal-user-id').value;
        const checkboxes = document.querySelectorAll('.feature-cb');
        let selectedFeatures = [];
        checkboxes.forEach(cb => {
            if (cb.checked) selectedFeatures.push(cb.value);
        });

        closeFeaturesModal();
        await postAction({ id: userId, action: 'update_features', features: selectedFeatures });
    }

    async function saveFeaturesAndApprove() {
        const userId = document.getElementById('modal-user-id').value;
        const checkboxes = document.querySelectorAll('.feature-cb');
        let selectedFeatures = [];
        checkboxes.forEach(cb => {
            if (cb.checked) selectedFeatures.push(cb.value);
        });

        const expiry = document.getElementById(`expiry-${userId}`).value;
        const purchased = document.getElementById(`purchased-${userId}`).value;
        const limit = document.getElementById(`limit-${userId}`).value;
        const planId = document.getElementById(`plan-${userId}`).value;

        closeFeaturesModal();
        await postAction({ 
            id: userId, 
            action: 'update_features_and_approve', 
            features: selectedFeatures,
            expiry_date: expiry,
            purchased_date: purchased,
            device_limit: limit,
            plan_id: planId
        });
    }

    function filterTable() {
        const query = document.getElementById('search-input').value.toLowerCase();
        const rows = document.querySelectorAll('#user-table-body tr');
        rows.forEach(row => {
            const text = row.innerText.toLowerCase();
            row.style.display = text.includes(query) ? '' : 'none';
        });
    }

    function showLoader(s) { loader.style.display = s ? 'flex' : 'none'; }
    
    // Initialize
    async function init() {
        await fetchPlansForDropdown();
        fetchUsers();
    }
    init();
</script>
</body>
</html>
